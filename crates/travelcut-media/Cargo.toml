[package]
name = "travelcut-media"
version = "0.1.0"
edition = "2021"
authors = ["TravelCut Studio Team"]
description = "High-performance, decoupled media processing engine for TravelCut Studio"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
regex = "1.11"
tempfile = "3.14"
uuid = { version = "1.11", features = ["v4", "serde"] }
which = "7.0"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.14"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "travelcut-media-cli"
path = "src/bin/cli.rs"

[lib]
name = "travelcut_media"
path = "src/lib.rs"

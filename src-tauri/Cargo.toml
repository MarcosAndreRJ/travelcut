[package]
name = "travelcut-studio"
version = "0.1.0"
description = "TravelCut Studio Desktop Core"
authors = ["TravelCut Studio Team"]
edition = "2021"

[lib]
name = "travelcut_studio_lib"
crate-type = ["rlib"]

[[bin]]
name = "travelcut-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
travelcut-media = { path = "../crates/travelcut-media" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
rfd = "0.17.2"
